<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Choose a new password - Muqmeen Group</title>
    <th:block th:replace="~{fragments/layout :: headAssets}"></th:block>
</head>
<body>
<div class="grid min-h-screen lg:grid-cols-[1fr,1.05fr]">
    <aside th:replace="~{fragments/layout :: authAside}"></aside>

    <main class="flex items-center justify-center px-4 py-12 sm:px-8">
        <div class="w-full max-w-md">
            <a th:replace="~{fragments/layout :: authMobileLogo}"></a>
            <span class="flex h-14 w-14 items-center justify-center rounded-2xl bg-gold-soft text-2xl text-gold-deep"><i class="fa-solid fa-lock"></i></span>
            <h1 class="mt-5 text-3xl font-semibold tracking-tight">Choose a new password</h1>
            <p class="mt-2 text-muted">Use the reset link sent to your email. Links expire after 30 minutes.</p>

            <form th:action="@{/reset-password}" th:object="${resetPasswordForm}" method="post" class="mt-7 space-y-4" data-busy="Updating…">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" th:field="*{token}">
                <div th:if="${#fields.hasErrors('token')}" class="rounded-2xl bg-warn-soft p-4 text-sm text-warn"><span th:errors="*{token}">Invalid token</span></div>
                <label class="label" for="password">New password
                    <input id="password" th:field="*{password}" type="password" autocomplete="new-password" required autofocus minlength="8" class="field" placeholder="At least 8 characters">
                    <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-xs text-warn">Password error</span>
                </label>
                <button type="submit" class="btn btn-gold w-full py-3.5">Update password</button>
            </form>
            <p class="mt-6 text-center text-sm text-muted"><a th:href="@{/login}" class="font-semibold text-ink hover:underline">Back to sign in</a></p>
        </div>
    </main>
</div>
</body>
</html>
