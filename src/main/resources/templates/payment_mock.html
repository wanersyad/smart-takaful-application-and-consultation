<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ToyyibPay Mock - Muqmeen Group</title>
    <th:block th:replace="~{fragments/layout :: headAssets}"></th:block>
</head>
<body>
<main class="mx-auto flex min-h-screen max-w-xl items-center px-4">
    <div class="fade-up card w-full p-8 text-center sm:p-10">
        <span class="mx-auto flex h-16 w-16 items-center justify-center rounded-2xl bg-ink text-2xl text-gold"><i class="fa-solid fa-credit-card"></i></span>
        <p class="eyebrow mt-6">Development only</p>
        <h1 class="mt-2 text-3xl font-semibold tracking-tight">ToyyibPay Mock</h1>
        <p class="mt-3 leading-7 text-muted">Local development payment for quotation bill <b class="text-ink" th:text="${billCode}">BILL</b>. This simulates the post-quotation payment gateway.</p>
        <div class="mt-8 grid gap-3">
            <a th:href="@{/payment/callback(billcode=${billCode},status_id='1')}" class="btn btn-gold" data-no-transition onclick="MG.loader({ icon: 'fa-shield-halved', title: 'Confirming your payment', sub: 'Please do not close or refresh this page' })">Mark Paid</a>
            <a th:href="@{/payment/callback(billcode=${billCode},status_id='3')}" class="btn btn-danger">Mark Failed</a>
        </div>
    </div>
</main>
</body>
</html>
