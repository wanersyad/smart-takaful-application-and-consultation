<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Customers - Muqmeen Admin</title>
    <th:block th:replace="~{fragments/layout :: headAssets}"></th:block>
</head>
<body class="lg:pl-64">
<th:block th:replace="~{fragments/layout :: adminNav('customers')}"></th:block>
<main class="space-y-6 p-5 sm:p-8">
    <div class="flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">
        <div>
            <h1 class="fade-up text-3xl font-semibold tracking-tight">Manage Customers</h1>
            <p class="fade-up mt-1 text-muted" style="--d:.1s">Customer accounts, profile data, application history, and sign-in status.</p>
        </div>
        <form action="/admin/customers" method="get" class="flex gap-2">
            <label class="relative"><i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-sm text-muted"></i>
                <input name="q" th:value="${query}" placeholder="Search name, email, phone" class="field !rounded-full !py-2.5 pl-11 sm:w-72" aria-label="Search customers"></label>
            <button type="submit" class="btn btn-ink btn-sm">Search</button>
        </form>
    </div>
    <p th:if="${flashMessage}" class="rounded-2xl bg-ok-soft p-4 text-ok" th:text="${flashMessage}">Saved</p>

    <section class="grid grid-cols-3 gap-4">
        <div class="reveal card p-5"><p class="text-sm text-muted">Shown</p><p class="mt-2 text-3xl font-semibold" th:text="${#lists.size(customers)}">0</p></div>
        <div class="reveal card p-5" style="--i:1"><p class="text-sm text-muted">Active</p><p class="mt-2 text-3xl font-semibold text-ok" th:text="${activeCustomers}">0</p></div>
        <div class="reveal card p-5" style="--i:2"><p class="text-sm text-muted">Sign-in disabled</p><p class="mt-2 text-3xl font-semibold" th:text="${disabledCustomers}">0</p></div>
    </section>

    <section class="reveal card min-w-0 overflow-hidden">
        <div th:if="${#lists.isEmpty(customers)}" class="p-12 text-center text-muted"><i class="fa-regular fa-user mb-3 block text-4xl"></i>No customers found.</div>
        <div th:if="${!#lists.isEmpty(customers)}" class="overflow-x-auto">
            <table class="mobile-card-table w-full text-sm">
                <thead class="table-head"><tr><th class="px-5 py-3 font-medium">Customer</th><th class="px-5 py-3 font-medium">Phone</th><th class="px-5 py-3 font-medium">Sign-in</th><th class="px-5 py-3 font-medium">Joined</th><th class="px-5 py-3"></th></tr></thead>
                <tbody class="divide-y divide-cream-line">
                    <tr th:each="customer : ${customers}" class="row-hover">
                        <td class="px-5 py-4" data-label="Customer">
                            <div class="flex items-center gap-3">
                                <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full text-xs font-semibold" th:classappend="${customer.isActive()} ? 'bg-gold-soft text-gold-deep' : 'bg-cream-deep text-muted'" th:text="${#strings.toUpperCase(#strings.substring(customer.fullName, 0, 1))}">A</span>
                                <div class="min-w-0"><p class="font-medium" th:text="${customer.fullName}">Customer</p><p class="truncate text-xs text-muted" th:text="${customer.email}">email</p></div>
                            </div>
                        </td>
                        <td class="whitespace-nowrap px-5 py-4 text-muted" data-label="Phone" th:text="${customer.phoneNumber}">phone</td>
                        <td class="px-5 py-4" data-label="Sign-in"><span class="chip" th:classappend="${customer.isActive()} ? 'bg-ok-soft text-ok' : 'bg-red-50 text-red-700'" th:text="${customer.isActive()} ? 'Active' : 'Disabled'">Active</span></td>
                        <td class="whitespace-nowrap px-5 py-4 text-muted" data-label="Joined" th:text="${#temporals.format(customer.createdAt, 'd MMM yyyy')}">date</td>
                        <td class="px-5 py-4 text-right"><a th:href="@{/admin/customers/{id}(id=${customer.id})}" class="btn btn-outline btn-sm">Open</a></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
