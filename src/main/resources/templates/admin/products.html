<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Products - Muqmeen Admin</title>
    <th:block th:replace="~{fragments/layout :: headAssets}"></th:block>
</head>
<body class="lg:pl-64">
<th:block th:replace="~{fragments/layout :: adminNav('products')}"></th:block>
<main class="space-y-6 p-5 sm:p-8">
    <div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
        <div>
            <h1 class="fade-up text-3xl font-semibold tracking-tight">Manage Takaful Products</h1>
            <p class="fade-up mt-1 text-muted" style="--d:.1s">Active products appear on the website and in the Plan Finder.</p>
        </div>
        <div class="flex flex-col gap-3 sm:flex-row">
            <label class="relative"><i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-sm text-muted"></i><input id="product-search" class="field !rounded-full !py-2.5 pl-11 sm:w-64" placeholder="Search products…" aria-label="Search products"></label>
            <a href="/admin/products/new" class="btn btn-gold"><i class="fa-solid fa-plus"></i>Add Product</a>
        </div>
    </div>
    <p th:if="${flashMessage}" class="rounded-2xl bg-ok-soft p-4 text-ok" th:text="${flashMessage}">Saved</p>

    <div th:if="${#lists.isEmpty(products)}" class="card p-12 text-center">
        <span class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-gold-soft text-2xl text-gold-deep"><i class="fa-solid fa-box-open"></i></span>
        <p class="mt-4 font-semibold">No product records yet</p>
        <p class="mt-1 text-muted">Create one to populate the public product section.</p>
    </div>

    <div class="grid grid-cols-1 gap-5 md:grid-cols-2 2xl:grid-cols-3">
        <article th:each="product, iter : ${products}" class="product-card reveal card card-hover flex flex-col p-5" th:classappend="${!product.active} ? 'opacity-70' : ''"
                 th:style="'--i:' + ${iter.index % 3}" th:attr="data-search=${#strings.toLowerCase(product.name + ' ' + (product.categoryLabel ?: ''))}">
            <div class="flex items-start justify-between gap-3">
                <span class="flex h-12 w-12 items-center justify-center rounded-2xl bg-gold-soft text-xl text-gold-deep"><i class="fa-solid" th:classappend="${product.iconClass}"></i></span>
                <div class="flex items-center gap-2">
                    <span th:if="${product.featured}" class="chip chip-gold">Popular</span>
                    <span class="chip" th:classappend="${product.active} ? 'bg-ok-soft text-ok' : 'chip-muted'" th:text="${product.active} ? 'Active' : 'Hidden'">Active</span>
                </div>
            </div>
            <p class="mt-4 text-xs font-semibold uppercase tracking-[0.18em] text-muted" th:text="${product.categoryLabel}">Category</p>
            <h2 class="mt-1 text-lg font-semibold" th:text="${product.name}">Name</h2>
            <p class="mt-1 flex-1 text-sm leading-6 text-muted" th:text="${product.summary != null && !#strings.isEmpty(product.summary) ? product.summary : product.description}">Summary</p>
            <div class="mt-5 flex flex-wrap items-center justify-end gap-2 border-t border-cream-line pt-4">
                <a th:href="@{/admin/products/{id}(id=${product.id})}" class="btn btn-outline btn-sm"><i class="fa-regular fa-eye"></i>View</a>
                <a th:href="@{/admin/products/{id}/edit(id=${product.id})}" class="btn btn-outline btn-sm"><i class="fa-solid fa-pen-to-square"></i>Edit</a>
                <form th:action="@{/admin/products/{id}/delete(id=${product.id})}" method="post" onsubmit="return confirm('Archive this product? It will be hidden from customers.');">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button class="btn btn-sm px-3 text-muted hover:text-red-700" title="Archive"><i class="fa-solid fa-box-archive"></i><span class="sr-only">Archive</span></button>
                </form>
            </div>
        </article>
    </div>
</main>
<script>
    document.getElementById('product-search').addEventListener('input', function (e) {
        const q = e.target.value.trim().toLowerCase();
        document.querySelectorAll('.product-card').forEach(function (c) { c.classList.toggle('hidden', q && !c.dataset.search.includes(q)); });
    });
</script>
</body>
</html>
