<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Forgot password - Muqmeen Group</title>
    <th:block th:replace="~{fragments/layout :: headAssets}"></th:block>
</head>
<body>
<div class="grid min-h-screen lg:grid-cols-[1fr,1.05fr]">
    <aside th:replace="~{fragments/layout :: authAside}"></aside>

    <main class="flex items-center justify-center px-4 py-12 sm:px-8">
        <div class="w-full max-w-md">
            <a th:replace="~{fragments/layout :: authMobileLogo}"></a>
            <a th:href="@{/login}" class="text-sm font-medium text-muted hover:text-ink"><i class="fa-solid fa-arrow-left mr-2"></i>Back to sign in</a>
            <span class="mt-6 flex h-14 w-14 items-center justify-center rounded-2xl bg-gold-soft text-2xl text-gold-deep"><i class="fa-solid fa-key"></i></span>
            <h1 class="mt-5 text-3xl font-semibold tracking-tight">Reset your password</h1>
            <p class="mt-2 text-muted">Enter your account email and we will send a reset link if the account exists.</p>

            <div th:if="${resetRequested}" class="mt-6 rounded-2xl bg-ok-soft p-4 text-sm text-ok"><i class="fa-solid fa-envelope-circle-check mr-2"></i>If that email belongs to a customer account, a reset link has been sent.</div>
            <div th:if="${emailError}" class="mt-6 rounded-2xl bg-warn-soft p-4 text-sm text-warn"><i class="fa-solid fa-circle-exclamation mr-2"></i>Password reset email is not configured yet. Please contact the Muqmeen team for help.</div>

            <form th:action="@{/forgot-password}" th:object="${forgotPasswordForm}" method="post" class="mt-7 space-y-4" data-busy="Sending link…">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <label class="label" for="email">Email
                    <input id="email" th:field="*{email}" type="email" autocomplete="email" required autofocus class="field" placeholder="you@example.com">
                    <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-xs text-warn">Email error</span>
                </label>
                <button type="submit" class="btn btn-ink w-full py-3.5">Send reset link</button>
            </form>
        </div>
    </main>
</div>
</body>
</html>
