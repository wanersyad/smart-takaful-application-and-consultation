<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${status} == 404 ? 'Page not found - Muqmeen Group' : 'Something went wrong - Muqmeen Group'">Error - Muqmeen Group</title>
    <th:block th:replace="~{fragments/layout :: headAssets}"></th:block>
</head>
<body>
<main class="relative isolate flex min-h-screen items-center justify-center overflow-hidden bg-ink px-6 text-white">
    <div th:replace="~{fragments/layout :: aurora}"></div>
    <div th:replace="~{fragments/layout :: orbit('left:50%;top:50%;width:min(820px,160vw);height:auto;transform:translate(-50%,-50%)')}"></div>
    <div class="fade-up relative w-full max-w-lg text-center">
        <span class="mx-auto flex h-16 w-16 items-center justify-center rounded-2xl bg-gold text-2xl text-ink">
            <i class="fa-solid" th:classappend="${status} == 404 ? 'fa-compass' : 'fa-triangle-exclamation'"></i>
        </span>
        <p class="eyebrow-dark mt-6" th:text="${status} != null ? 'Error ' + ${status} : 'Error'">Error</p>
        <h1 class="mt-3 text-3xl font-semibold" th:text="${status} == 404 ? 'We can''t find that page' : 'Something went wrong'">Something went wrong</h1>
        <p class="mt-4 leading-7 text-white/65" th:text="${status} == 404
                ? 'The page you were looking for may have moved or no longer exists.'
                : 'We hit an unexpected hiccup on our end. Please try again in a moment — your information is safe.'">Please try again in a moment.</p>
        <div class="mt-8 flex flex-wrap items-center justify-center gap-3">
            <a th:href="@{/}" class="btn btn-gold"><i class="fa-solid fa-house"></i>Back to home</a>
            <a href="/#contact" class="btn btn-ghost-dark">Contact us</a>
        </div>
    </div>
</main>
</body>
</html>
