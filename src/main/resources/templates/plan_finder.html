<!DOCTYPE html>
<html th:lang="${lang}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${lang == 'ms'} ? 'Cari Pelan Sesuai - Muqmeen Group' : 'Plan Finder - Muqmeen Group'">Plan Finder - Muqmeen Group</title>
    <th:block th:replace="~{fragments/layout :: headAssets}"></th:block>
    <style>
        /* One question per screen once JS is running; without JS every question stays visible. */
        .pf-js .pf-q { display: none; }
        .pf-js .pf-q.active { display: block; animation: pfIn .45s cubic-bezier(.22,.61,.36,1) both; }
        .pf-js .pf-q.back { animation-name: pfInBack; }
        @keyframes pfIn { from { opacity: 0; transform: translateX(36px); } to { opacity: 1; transform: none; } }
        @keyframes pfInBack { from { opacity: 0; transform: translateX(-36px); } to { opacity: 1; transform: none; } }
        .pf-nojs-only { display: block; } .pf-js .pf-nojs-only { display: none; }
        .pf-js-only { display: none; } .pf-js .pf-js-only { display: flex; }
    </style>
</head>
<body th:with="ms=${lang == 'ms'}">
<nav th:replace="~{fragments/layout :: siteNav('plan-finder')}"></nav>

<main class="mx-auto grid max-w-5xl gap-10 px-4 py-10 sm:px-6 lg:grid-cols-[1fr,300px]">
    <section>
        <div class="flex flex-wrap items-center justify-between gap-4">
            <p class="eyebrow"><i class="fa-solid fa-wand-magic-sparkles mr-2"></i><span th:text="${ms} ? 'Cari Pelan Sesuai' : 'Plan Finder'">Plan Finder</span></p>
            <div class="flex rounded-full border border-cream-line bg-white p-1 text-xs font-medium" role="group" aria-label="Language">
                <a href="/plan-finder?lang=en" class="rounded-full px-3 py-1.5" th:classappend="${!ms} ? 'bg-ink text-white' : 'text-muted hover:text-ink'">EN</a>
                <a href="/plan-finder?lang=ms" class="rounded-full px-3 py-1.5" th:classappend="${ms} ? 'bg-ink text-white' : 'text-muted hover:text-ink'">BM</a>
            </div>
        </div>
        <h1 class="fade-up mt-4 text-3xl font-semibold leading-tight tracking-tight sm:text-4xl" th:text="${ms} ? 'Pelan Takaful mana yang sesuai untuk anda?' : 'Which Takaful plan fits you?'">Which Takaful plan fits you?</h1>
        <p class="fade-up mt-2 text-muted" style="--d:.1s" th:text="${ms} ? 'Jawab 8 soalan ringkas (kira-kira 1 minit). Kami akan mencadangkan pelan yang paling berkaitan.' : 'Answer 8 quick questions (about 1 minute). We will suggest the most relevant plans.'">Intro</p>

        <div class="pf-js-only mt-6 items-center gap-3">
            <div class="h-1.5 flex-1 overflow-hidden rounded-full bg-cream-line"><div id="pf-bar" class="h-full w-0 rounded-full bg-gold transition-all duration-500"></div></div>
            <span class="text-xs font-semibold text-muted"><span id="pf-count">1</span> / <span th:text="${#lists.size(questions)}">8</span></span>
        </div>

        <p th:if="${planFinderError}" class="mt-6 rounded-2xl bg-warn-soft p-4 text-warn" th:text="${planFinderError}">Error</p>

        <form th:action="@{/plan-finder}" method="post" id="pf-form" class="mt-6">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="lang" th:value="${lang}">

            <fieldset th:each="q, iter : ${questions}" class="pf-q mb-8" th:attr="data-key=${q.key()},data-multi=${q.multiple()},data-optional=${q.optional()}">
                <legend class="sr-only" th:text="${q.label(lang)}">Question</legend>
                <span class="flex h-14 w-14 items-center justify-center rounded-2xl bg-gold-soft text-2xl text-gold-deep" aria-hidden="true">
                    <i class="fa-solid" th:classappend="${q.key() == 'ageBand'} ? 'fa-cake-candles' : (${q.key() == 'maritalStatus'} ? 'fa-people-roof' : (${q.key() == 'childrenBand'} ? 'fa-children' : (${q.key() == 'goals'} ? 'fa-bullseye' : (${q.key() == 'existingCoverage'} ? 'fa-umbrella' : (${q.key() == 'budgetBand'} ? 'fa-wallet' : (${q.key() == 'occupationClass'} ? 'fa-briefcase' : 'fa-notes-medical'))))))"></i>
                </span>
                <h2 class="mt-5 text-2xl font-semibold leading-tight tracking-tight sm:text-3xl" th:text="${q.label(lang)}">Question</h2>
                <p th:if="${q.optional()}" class="mt-2 text-sm text-muted"><i class="fa-solid fa-lock mr-1"></i><span th:text="${ms} ? 'Pilihan — tidak dihantar ke AI.' : 'Optional — never sent to the AI.'">Optional</span></p>
                <div class="mt-6 flex flex-wrap gap-3">
                    <label th:each="opt : ${q.options()}" class="pill-opt relative">
                        <input class="absolute opacity-0" th:type="${q.multiple()} ? 'checkbox' : 'radio'" th:name="${q.key()}" th:value="${opt.code()}" th:required="${!q.multiple() and !q.optional()}">
                        <span th:text="${opt.label(lang)}">Option</span>
                    </label>
                </div>
            </fieldset>

            <div class="flex items-center justify-between">
                <button type="button" id="pf-back" class="pf-js-only btn px-4 py-2.5 text-sm text-muted hover:text-ink" disabled><i class="fa-solid fa-arrow-left"></i><span th:text="${ms} ? 'Kembali' : 'Back'">Back</span></button>
                <button type="submit" id="pf-next" class="btn btn-ink ml-auto px-6 py-3 text-sm"><span th:text="${ms} ? 'Cari pelan saya' : 'Find my plan'">Find my plan</span><i class="fa-solid fa-arrow-right arrow"></i></button>
            </div>
        </form>
    </section>

    <aside class="fade-up space-y-4" style="--d:.2s">
        <div class="panel-dark rounded-3xl p-6">
            <div th:replace="~{fragments/layout :: aurora}"></div>
            <div th:replace="~{fragments/layout :: orbit('width:420px;height:420px;right:-200px;top:-180px')}"></div>
            <i class="fa-solid fa-user-shield relative text-2xl text-gold"></i>
            <p class="relative mt-4 font-semibold" th:text="${ms} ? 'Privasi terjamin' : 'Private by design'">Private by design</p>
            <p class="relative mt-2 text-sm leading-6 text-white/65" th:text="${ms}
                ? 'Kami tidak meminta nama, IC atau maklumat hubungan di sini. Jawapan anda (kecuali soalan kesihatan) diproses oleh AI untuk mencadangkan pelan. Cadangan ini bukan nasihat kewangan; ejen berlesen akan mengesahkan kesesuaian dan caruman.'
                : 'We do not ask for your name, IC or contact details here. Your answers (except the health question) are processed by AI to suggest plans. Suggestions are not financial advice; a licensed agent confirms suitability and contribution.'">Privacy</p>
        </div>
        <div class="card hidden p-6 lg:block">
            <p class="text-sm font-semibold" th:text="${ms} ? 'Jawapan anda' : 'Your answers'">Your answers</p>
            <ul id="pf-summary" class="mt-3 space-y-2 text-sm text-muted"><li class="italic" th:text="${ms} ? 'Pilihan anda akan dipaparkan di sini.' : 'Your choices will appear here.'">Your choices will appear here.</li></ul>
        </div>
    </aside>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:inline="javascript">
    (function () {
        const ms = /*[[${lang == 'ms'}]]*/ false;
        const T = ms
            ? { next: 'Seterusnya', finish: 'Cari pelan saya', pick: 'Sila pilih satu jawapan.', goal: 'Sila pilih sekurang-kurangnya satu matlamat.',
                title: 'Mencari pelan anda', sub: 'Biasanya beberapa saat, kadang-kadang sehingga satu minit',
                steps: ['Membaca jawapan anda', 'Memadankan dengan pelan kami', 'Menyediakan cadangan'] }
            : { next: 'Next', finish: 'Find my plan', pick: 'Please choose an answer.', goal: 'Please choose at least one goal.',
                title: 'Finding your plans', sub: 'Usually a few seconds, sometimes up to a minute',
                steps: ['Reading your answers', 'Matching with our plans', 'Preparing your suggestions'] };
        const form = document.getElementById('pf-form');
        const qs = Array.from(form.querySelectorAll('.pf-q'));
        const back = document.getElementById('pf-back'), next = document.getElementById('pf-next');
        let i = 0;
        document.body.classList.add('pf-js');

        function answered(q) { return !!q.querySelector('input:checked'); }
        function show(n, dir) {
            qs[i].classList.remove('active', 'back');
            i = n;
            qs[i].classList.add('active'); qs[i].classList.toggle('back', dir < 0);
            document.getElementById('pf-count').textContent = i + 1;
            document.getElementById('pf-bar').style.width = ((i + 1) / qs.length * 100) + '%';
            back.disabled = i === 0;
            next.querySelector('span').textContent = i === qs.length - 1 ? T.finish : T.next;
        }
        function shake(q) { q.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-8px)' }, { transform: 'translateX(8px)' }, { transform: 'none' }], { duration: 320 }); }
        function summary() {
            const ul = document.getElementById('pf-summary');
            const rows = qs.filter(answered).map(function (q) {
                return Array.from(q.querySelectorAll('input:checked')).map(function (x) { return x.nextElementSibling.textContent; }).join(', ');
            });
            if (rows.length) ul.innerHTML = rows.map(function (r) { return '<li class="flex gap-2"><i class="fa-solid fa-check mt-1 text-xs text-gold-deep"></i><span>' + MG.esc(r) + '</span></li>'; }).join('');
        }

        next.addEventListener('click', function (e) {
            const q = qs[i];
            if (q.dataset.optional !== 'true' && !answered(q)) { e.preventDefault(); shake(q); return; }
            if (i < qs.length - 1) { e.preventDefault(); show(i + 1, 1); }
            // On the last question the click submits the form normally.
        });
        back.addEventListener('click', function () { if (i > 0) show(i - 1, -1); });
        form.addEventListener('change', function (e) {
            summary();
            const q = e.target.closest('.pf-q');
            if (q === qs[i] && e.target.type === 'radio' && i < qs.length - 1) setTimeout(function () { show(i + 1, 1); }, 320);
        });
        form.addEventListener('submit', function (e) {
            const goals = form.querySelector('.pf-q[data-key="goals"]');
            if (goals && !answered(goals)) { e.preventDefault(); show(qs.indexOf(goals), -1); shake(goals); alert(T.goal); return; }
            // The real AI call happens on the server; keep people informed while they wait.
            MG.loader({ title: T.title, sub: T.sub, steps: T.steps, stepEvery: 1600 });
        });
        show(0, 1);
    })();
</script>
<th:block th:replace="~{fragments/layout :: page-scripts}"></th:block>
</body>
</html>
